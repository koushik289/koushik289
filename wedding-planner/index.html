<title>Wedding Run-up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column. Countdown and a 15-day strip on top, three views in the middle, capture bar pinned to the thumb. */
:root {
  --bg: #fbf6f8; --surface: #ffffff; --sunk: #f3e9ee; --line: #e6d5dd;
  --ink: #2a1320; --muted: #7a6170;
  --accent: #8a1c5b; --on-accent: #ffffff;
  --gold: #b87400; --late: #c4320a; --ok: #2f7d4f;
  --display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #170c12; --surface: #23131b; --sunk: #2e1a24; --line: #432a37;
  --ink: #f6e9ef; --muted: #b79aaa;
  --accent: #f07fb6; --on-accent: #2a0d1c;
  --gold: #ffb53d; --late: #ff8a5c; --ok: #6fcf97; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #170c12; --surface: #23131b; --sunk: #2e1a24; --line: #432a37;
  --ink: #f6e9ef; --muted: #b79aaa;
  --accent: #f07fb6; --on-accent: #2a0d1c;
  --gold: #ffb53d; --late: #ff8a5c; --ok: #6fcf97; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 560px; margin: 0 auto; padding-block: 16px 190px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }

.count { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.count b { font-family: var(--display); font-weight: 700; font-size: 64px; line-height: .9; color: var(--accent); font-variant-numeric: tabular-nums; }
.count h1 { font-family: var(--display); font-weight: 700; font-size: 22px; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 14px; margin: 4px 0 0; }

.strip { display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px; }
.day { background: var(--sunk); border: 1px solid transparent; border-radius: 8px; padding: 6px 0 4px; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; font-variant-numeric: tabular-nums; }
.day small { font-size: 9px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); height: 11px; }
.day i { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
.day.has i { background: var(--accent); }
.day.past { opacity: .45; }
.day.today { border-color: var(--ink); background: var(--surface); font-weight: 600; }
.day.fly small, .day.wed small { color: var(--gold); font-weight: 600; }
.day.wed { background: var(--accent); color: var(--on-accent); }
.day.wed small { color: var(--on-accent); }
.day.picked { outline: 2px solid var(--gold); outline-offset: 1px; }

.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--sunk); border-radius: 12px; padding: 4px; gap: 4px; }
.tabs button { border: 0; background: transparent; border-radius: 9px; padding: 10px 4px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.tabs em { font-style: normal; font-weight: 500; font-size: 13px; margin-left: 4px; }

.group { display: flex; flex-direction: column; gap: 2px; }
.group h2 { font-family: var(--display); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px; }
.group h2.late { color: var(--late); }
#view { display: flex; flex-direction: column; gap: 22px; }

.item { display: grid; grid-template-columns: 44px 1fr; align-items: start; border-bottom: 1px solid var(--line); }
.tick { width: 44px; height: 48px; border: 0; background: transparent; display: grid; place-items: center; padding: 0; }
.tick span { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; font-size: 14px; line-height: 1; color: transparent; }
.item.done .tick span { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.dot { width: 44px; height: 48px; display: grid; place-items: center; }
.dot::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--gold); transform: rotate(45deg); }
.body { min-width: 0; border: 0; background: transparent; text-align: left; padding: 12px 0; width: 100%; }
.body p { margin: 0; overflow-wrap: anywhere; }
.item.done .body p { text-decoration: line-through; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; font-size: 12px; color: var(--muted); }
.chip { border: 1px solid var(--line); border-radius: 20px; padding: 1px 8px; white-space: nowrap; }
.chip.late { color: var(--late); border-color: var(--late); font-weight: 600; }
.chip.today { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.note { font-size: 13px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; white-space: pre-wrap; }

.edit { grid-column: 1 / -1; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0 0 12px;
  display: flex; flex-direction: column; gap: 10px; }
.edit label { font-size: 12px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.row label { flex: 1 1 130px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
input[type="text"], input[type="date"], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 44px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 9px 14px; font-weight: 600; }
.btn.go { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--late); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.link { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 4px 0; font-size: 14px; }

.empty { color: var(--muted); padding: 18px 0; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); }
.empty strong { color: var(--ink); display: block; font-family: var(--display); font-size: 18px; margin-bottom: 4px; }
.banner { background: var(--sunk); border-left: 0; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.banner.bad { color: var(--late); }

.capture { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.capture form { max-width: 528px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.capture .top { display: flex; gap: 8px; }
.capture .top input { flex: 1; }
.capture .opts { display: flex; gap: 8px; align-items: center; }
.capture .opts > * { min-width: 0; }
.seg { display: flex; background: var(--sunk); border-radius: 9px; padding: 3px; flex: none; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 6px 12px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.capture .opts input, .capture .opts select { padding: 6px 8px; font-size: 14px; flex: 1.5 1 0; }
.capture .opts select { flex: 1 1 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 14px; display: flex; gap: 14px; align-items: center; font-size: 14px; max-width: calc(100% - 32px); }
.toast button { border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }
</style>

<div class="wrap">
  <header>
    <div class="count"><b id="days">–</b><h1 id="headline">days to the wedding</h1></div>
    <p class="sub" id="subline">Wedding on Wed 25 Nov · Flight to India on Fri 13 Nov</p>
  </header>

  <div class="strip" id="strip" aria-label="Days from 11 to 25 November. Tap a day to set it as the due date."></div>

  <div>
    <div class="bar" aria-hidden="true"><span id="prog"></span></div>
    <p class="sub" id="progText">Loading your list…</p>
  </div>

  <div id="banner" class="banner" hidden></div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="now" aria-selected="true">Now<em id="nNow"></em></button>
    <button role="tab" data-tab="list" aria-selected="false">Checklist<em id="nList"></em></button>
    <button role="tab" data-tab="ideas" aria-selected="false">Ideas<em id="nIdeas"></em></button>
  </div>

  <main id="view">
    <div class="empty"><strong>Loading…</strong>Your tasks and ideas will show here.</div>
  </main>
</div>

<div class="capture">
  <form id="capForm" autocomplete="off">
    <div class="top">
      <input type="text" id="capText" placeholder="Add a task or dump an idea…" aria-label="New task or idea" enterkeyhint="done">
      <button class="btn go" type="submit" id="capAdd">Add</button>
    </div>
    <div class="opts">
      <div class="seg" role="group" aria-label="Save as">
        <button type="button" id="kindTask" aria-pressed="true">Task</button>
        <button type="button" id="kindIdea" aria-pressed="false">Idea</button>
      </div>
      <input type="date" id="capDue" aria-label="Due date">
      <select id="capCat" aria-label="Category"></select>
    </div>
  </form>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function () {
  var FLIGHT = "2026-11-13", WEDDING = "2026-11-25", STRIP_START = "2026-11-11", INDIA_END = "2026-11-21";
  var CATS = ["Other", "Travel", "Outfits", "Venue", "Food", "Guests", "Rituals", "Photos", "Money", "Home"];
  var DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  var S = { items: [], tab: "now", showDone: false, editing: null, loaded: false, kind: "task", dirty: false };
  var db = null, col = null, queue = {}, toastTimer = null;
  var $ = function (id) { return document.getElementById(id); };

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function today() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function utc(s) { var p = s.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function diff(a, b) { return Math.round((utc(a) - utc(b)) / 86400000); }
  function addDays(s, n) { var d = new Date(utc(s) + n * 86400000); return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate()); }
  function nice(s) { var d = new Date(utc(s)); return DOW[d.getUTCDay()] + " " + d.getUTCDate() + " " + MON[d.getUTCMonth()]; }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }

  function h(tag, attrs, kids) {
    var e = document.createElement(tag), k;
    for (k in attrs || {}) {
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }

  /* ---------- saving ---------- */
  function fail(e) {
    var code = e && e.code;
    var msg = code === "quota_exceeded" ? "The list is full. Delete some items, then try again."
      : code === "invalid_argument" ? "You can view this list but not change it."
      : "That change did not save. Check your connection and try again.";
    banner(msg, true);
  }
  function write(id, fn) {
    queue[id] = (queue[id] || Promise.resolve()).then(fn).then(function () { banner(""); }, fail);
  }
  function patch(id, data) { write(id, function () { return col.doc(id).update(data); }); }
  function create(data) {
    var id = "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    write(id, function () { return col.doc(id).set(data); });
  }
  function remove(it) {
    write(it.id, function () { return col.doc(it.id).delete(); });
    var copy = { text: it.text, kind: it.kind, done: it.done, due: it.due, cat: it.cat, note: it.note, created: it.created };
    toast("Deleted", "Undo", function () { write(it.id, function () { return col.doc(it.id).set(copy); }); });
  }

  function banner(msg, bad) {
    var b = $("banner");
    b.hidden = !msg; b.textContent = msg || ""; b.className = "banner" + (bad ? " bad" : "");
  }
  function toast(msg, action, fn) {
    var t = $("toast"); clearTimeout(toastTimer);
    t.textContent = ""; t.appendChild(document.createTextNode(msg));
    if (action) t.appendChild(h("button", { text: action, onclick: function () { t.hidden = true; fn(); } }));
    t.hidden = false;
    toastTimer = setTimeout(function () { t.hidden = true; }, 6000);
  }

  /* ---------- header ---------- */
  function renderHeader() {
    var t = today(), toWed = diff(WEDDING, t), toFly = diff(FLIGHT, t);
    var days = $("days"), head = $("headline"), sub = $("subline");
    if (toWed > 0) { days.textContent = toWed; head.textContent = (toWed === 1 ? "day" : "days") + " to the wedding"; }
    else if (toWed === 0) { days.textContent = "0"; head.textContent = "Today is the wedding day"; }
    else { days.textContent = "✓"; head.textContent = "Married " + plural(-toWed, "day") + " ago"; }
    sub.textContent = toFly > 1 ? "You fly to India in " + toFly + " days, on Fri 13 Nov. Wedding on Wed 25 Nov."
      : toFly === 1 ? "You fly to India tomorrow. Wedding on Wed 25 Nov."
      : toFly === 0 ? "Flight day. Wedding on Wed 25 Nov."
      : toWed >= 0 ? "You are in India. Wedding on Wed 25 Nov." : "Wedding was on Wed 25 Nov.";

    var open = {}; S.items.forEach(function (i) { if (i.kind === "task" && !i.done && i.due) open[i.due] = 1; });
    var strip = $("strip"), picked = $("capDue").value; strip.textContent = "";
    for (var n = 0; n < 15; n++) {
      (function (d) {
        var cls = "day" + (d < t ? " past" : "") + (d === t ? " today" : "") + (d === FLIGHT ? " fly" : "") + (d === WEDDING ? " wed" : "") + (open[d] ? " has" : "") + (d === picked ? " picked" : "");
        strip.appendChild(h("button", { class: cls, type: "button", "aria-label": nice(d) + (open[d] ? ", has open tasks" : ""), onclick: function () {
          $("capDue").value = $("capDue").value === d ? "" : d; setKind("task"); renderHeader(); $("capText").focus();
        } }, [h("small", { text: d === FLIGHT ? "fly" : d === WEDDING ? "wed" : DOW[new Date(utc(d)).getUTCDay()].slice(0, 2) }), String(+d.slice(8)), h("i")]));
      })(addDays(STRIP_START, n));
    }

    var tasks = S.items.filter(function (i) { return i.kind === "task"; });
    var done = tasks.filter(function (i) { return i.done; }).length;
    $("prog").style.width = tasks.length ? Math.round(done / tasks.length * 100) + "%" : "0";
    if (S.loaded) $("progText").textContent = tasks.length ? done + " of " + plural(tasks.length, "task") + " done" : "No tasks yet";
  }

  /* ---------- rows ---------- */
  function dueChip(it) {
    if (!it.due) return null;
    var d = diff(it.due, today());
    if (it.done) return h("span", { class: "chip", text: nice(it.due) });
    if (d < 0) return h("span", { class: "chip late", text: plural(-d, "day") + " late" });
    if (d === 0) return h("span", { class: "chip today", text: "Today" });
    if (d === 1) return h("span", { class: "chip", text: "Tomorrow" });
    return h("span", { class: "chip", text: nice(it.due) });
  }

  function row(it) {
    var isTask = it.kind === "task";
    var meta = h("div", { class: "meta" }, [
      isTask ? dueChip(it) : null,
      it.cat && it.cat !== "Other" ? h("span", { class: "chip", text: it.cat }) : null,
      it.starter ? h("span", { class: "chip", text: "suggested" }) : null
    ]);
    var el = h("div", { class: "item" + (it.done ? " done" : "") }, [
      isTask
        ? h("button", { class: "tick", type: "button", "aria-label": (it.done ? "Mark not done: " : "Mark done: ") + it.text, onclick: function () { patch(it.id, { done: !it.done }); } }, [h("span", { text: "✓" })])
        : h("div", { class: "dot" }),
      h("button", { class: "body", type: "button", "aria-expanded": S.editing === it.id ? "true" : "false", onclick: function () { S.editing = S.editing === it.id ? null : it.id; render(); } }, [
        h("p", { text: it.text }),
        it.note ? h("div", { class: "note", text: it.note }) : null,
        meta.childNodes.length ? meta : null
      ])
    ]);
    if (S.editing === it.id) el.appendChild(editor(it));
    return el;
  }

  function catSelect(id, value) {
    var s = h("select", { id: id });
    CATS.forEach(function (c) { var o = h("option", { value: c, text: c }); if (c === (value || "Other")) o.selected = true; s.appendChild(o); });
    return s;
  }

  function editor(it) {
    var text = h("textarea", { id: "edText", rows: "2" }); text.value = it.text;
    var due = h("input", { type: "date", id: "edDue" }); due.value = it.due || "";
    var cat = catSelect("edCat", it.cat);
    var note = h("textarea", { id: "edNote", rows: "2", placeholder: "Phone numbers, sizes, prices, links…" }); note.value = it.note || "";
    var isTask = it.kind === "task";
    function close() { S.editing = null; render(); }
    return h("div", { class: "edit" }, [
      h("label", {}, ["What", text]),
      h("div", { class: "row" }, [h("label", {}, ["Due date", due]), h("label", {}, ["Category", cat])]),
      h("label", {}, ["Notes", note]),
      h("div", { class: "row" }, [
        h("button", { class: "btn go", type: "button", text: "Save", onclick: function () {
          var t = text.value.trim(); if (!t) { text.focus(); return; }
          patch(it.id, { text: t, due: due.value || "", cat: cat.value, note: note.value.trim(), starter: false }); close();
        } }),
        h("button", { class: "btn", type: "button", text: isTask ? "Move to ideas" : "Make it a task", onclick: function () {
          patch(it.id, { kind: isTask ? "idea" : "task", done: false, due: due.value || "" }); close();
        } }),
        h("button", { class: "btn danger", type: "button", text: "Delete", onclick: function () { S.editing = null; remove(it); } }),
        h("button", { class: "btn", type: "button", text: "Cancel", onclick: close })
      ])
    ]);
  }

  function group(title, items, cls, right) {
    var g = h("section", { class: "group" }, [h("h2", { class: cls || "" }, [h("span", { text: title }), h("span", { text: right == null ? String(items.length) : right })])]);
    items.forEach(function (i) { g.appendChild(row(i)); });
    return g;
  }
  function empty(title, text) { return h("div", { class: "empty" }, [h("strong", { text: title }), text]); }
  function byDue(a, b) { return (a.due || "9") < (b.due || "9") ? -1 : (a.due || "9") > (b.due || "9") ? 1 : a.created - b.created; }

  /* ---------- views ---------- */
  function render() {
    renderHeader();
    var v = $("view"), t = today();
    var tasks = S.items.filter(function (i) { return i.kind === "task"; }).sort(byDue);
    var open = tasks.filter(function (i) { return !i.done; });
    var ideas = S.items.filter(function (i) { return i.kind !== "task"; }).sort(function (a, b) { return b.created - a.created; });
    var late = open.filter(function (i) { return i.due && i.due < t; });
    var now = open.filter(function (i) { return i.due === t; });
    var soon = open.filter(function (i) { return i.due > t && i.due <= addDays(t, 3); });

    $("nNow").textContent = late.length + now.length ? String(late.length + now.length) : "";
    $("nList").textContent = open.length ? String(open.length) : "";
    $("nIdeas").textContent = ideas.length ? String(ideas.length) : "";
    Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (b) { b.setAttribute("aria-selected", b.dataset.tab === S.tab ? "true" : "false"); });

    v.textContent = "";
    if (!S.loaded) { v.appendChild(empty("Loading…", "Your tasks and ideas will show here.")); return; }

    if (S.tab === "now") {
      if (late.length) v.appendChild(group("Overdue", late, "late"));
      if (now.length) v.appendChild(group("Today, " + nice(t), now));
      if (soon.length) v.appendChild(group("Next 3 days", soon));
      if (!late.length && !now.length && !soon.length) {
        v.appendChild(empty("Nothing due through " + nice(addDays(t, 3)), open.length ? plural(open.length, "open task") + " later or without a date. See Checklist." : "Add your first task in the bar below."));
      }
      var undated = open.filter(function (i) { return !i.due; });
      if (undated.length) v.appendChild(h("button", { class: "link", type: "button", text: plural(undated.length, "task") + " without a date. Give them one in Checklist.", onclick: function () { S.tab = "list"; render(); } }));
    }

    if (S.tab === "list") {
      var shown = S.showDone ? tasks : open, any = false;
      var phases = [
        ["Overdue", function (i) { return !i.done && i.due && i.due < t; }, "late"],
        ["Before the flight · till Fri 13 Nov", function (i) { return i.due && i.due <= FLIGHT; }],
        ["In India · 14 to 21 Nov", function (i) { return i.due > FLIGHT && i.due <= INDIA_END; }],
        ["Wedding week · 22 to 25 Nov", function (i) { return i.due > INDIA_END && i.due <= WEDDING; }],
        ["After the wedding", function (i) { return i.due > WEDDING; }],
        ["No date yet", function (i) { return !i.due; }]
      ];
      var used = {};
      phases.forEach(function (p) {
        var list = shown.filter(function (i) { return !used[i.id] && p[1](i); });
        list.forEach(function (i) { used[i.id] = 1; });
        if (list.length) { any = true; v.appendChild(group(p[0], list, p[2])); }
      });
      if (!any) v.appendChild(empty(tasks.length ? "All done" : "No tasks yet", tasks.length ? "Every task is ticked off." : "Type a task in the bar below and tap Add."));
      var doneCount = tasks.length - open.length;
      if (doneCount) v.appendChild(h("button", { class: "link", type: "button", text: S.showDone ? "Hide done tasks" : "Show " + plural(doneCount, "done task"), onclick: function () { S.showDone = !S.showDone; render(); } }));
    }

    if (S.tab === "ideas") {
      if (ideas.length) v.appendChild(group("Ideas and loose notes", ideas));
      else v.appendChild(empty("No ideas yet", "Switch the bar below to Idea and dump anything: a song, a gift, a thing to ask the planner. Turn it into a task later."));
    }
  }

  function requestRender() {
    var ed = document.querySelector(".edit");
    if (ed && ed.contains(document.activeElement)) { S.dirty = true; return; }
    render();
  }
  document.addEventListener("focusout", function () {
    if (S.dirty) setTimeout(function () { var ed = document.querySelector(".edit"); if (S.dirty && !(ed && ed.contains(document.activeElement))) { S.dirty = false; render(); } }, 50);
  });

  /* ---------- capture bar ---------- */
  function setKind(k) {
    S.kind = k;
    $("kindTask").setAttribute("aria-pressed", k === "task" ? "true" : "false");
    $("kindIdea").setAttribute("aria-pressed", k === "idea" ? "true" : "false");
    $("capDue").disabled = k === "idea";
    $("capText").placeholder = k === "task" ? "Add a task…" : "Dump an idea…";
  }
  $("kindTask").addEventListener("click", function () { setKind("task"); });
  $("kindIdea").addEventListener("click", function () { setKind("idea"); });
  $("capDue").addEventListener("change", renderHeader);
  CATS.forEach(function (c) { $("capCat").appendChild(h("option", { value: c, text: c === "Other" ? "Category" : c })); });

  $("capForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var t = $("capText").value.trim();
    if (!t) { $("capText").focus(); return; }
    if (!col) { banner("Saving is not available in this view. Open the page in Claude while signed in.", true); return; }
    create({ text: t, kind: S.kind, done: false, due: S.kind === "task" ? $("capDue").value || "" : "", cat: $("capCat").value, note: "", created: Date.now() });
    $("capText").value = "";
    if (S.kind === "idea" && S.tab !== "ideas") toast("Saved to Ideas");
    else if (S.kind === "task" && S.tab === "ideas") toast("Saved to Checklist");
    else if (S.kind === "task" && S.tab === "now") { var d = $("capDue").value; if (!d || d > addDays(today(), 3) ) toast("Saved to Checklist"); }
  });

  Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (b) {
    b.addEventListener("click", function () { S.tab = b.dataset.tab; S.editing = null; try { localStorage.setItem("tab", S.tab); } catch (e) {} render(); });
  });
  try { var saved = localStorage.getItem("tab"); if (saved === "now" || saved === "list" || saved === "ideas") S.tab = saved; } catch (e) {}

  /* ---------- start ---------- */
  setKind("task");
  render();
  setInterval(renderHeader, 60000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) requestRender(); });

  function start() {
    var use = window.claude && window.claude.use;
    if (!use) { S.loaded = true; render(); banner("Saving is not available in this view. Open the page in Claude while signed in.", true); return; }
    window.claude.use("db").then(function (d) {
      if (!d) { S.loaded = true; render(); banner("Saving is not available in this view. Open the page in Claude while signed in.", true); return; }
      db = d; col = db.collection("items");
      var slow = setTimeout(function () { banner(S.loaded ? "Can't reach the saved list right now. What you see may be out of date." : "Can't reach your saved list yet. Still trying…"); }, 10000);
      col.onSnapshot(function (snap) {
        S.items = snap.docs.map(function (doc) {
          var x = doc.data() || {};
          return { id: doc.id, text: String(x.text || ""), kind: x.kind === "idea" ? "idea" : "task", done: !!x.done, due: typeof x.due === "string" ? x.due : "", cat: String(x.cat || "Other"), note: String(x.note || ""), created: +x.created || 0, starter: !!x.starter };
        });
        S.loaded = true;
        if (!snap.metadata.fromCache) { clearTimeout(slow); if (!$("banner").classList.contains("bad")) banner(""); }
        requestRender();
      }, function (err) {
        clearTimeout(slow); S.loaded = true; render();
        banner(err && err.code === "revoked" ? "This list is no longer available in this view." : "The list stopped updating. Close and reopen the page.", true);
      });
    });
  }
  start();
})();
</script>
