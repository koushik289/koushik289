<title>Wedding Run-up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a phone app. Gradient countdown card and tappable day strip on top, cards below, tab bar and a round add button at the thumb, bottom sheet for add and edit. */
:root {
  --bg: #faf4f9; --surface: #ffffff; --sunk: #f1e7f0; --line: #e8d9e5;
  --ink: #25122b; --muted: #77667f;
  --accent: #c2185b; --late: #d93a1a; --ok: #1f9d55;
  --h1: #5b1a8c; --h2: #c2185b; --h3: #f4511e; --on-hero: #ffffff;
  --cs: 82%; --tint: 13%;
  --shadow: 0 1px 2px rgb(60 20 70 / .06), 0 6px 18px rgb(60 20 70 / .07);
  --display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #130a17; --surface: #211327; --sunk: #2c1a33; --line: #3e2a48;
  --ink: #f7ecf8; --muted: #b5a2bd;
  --accent: #ff5c9a; --late: #ff8763; --ok: #5fd08f;
  --h1: #5b1a8c; --h2: #c2185b; --h3: #f4511e; --on-hero: #ffffff;
  --cs: 50%; --tint: 20%;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #130a17; --surface: #211327; --sunk: #2c1a33; --line: #3e2a48;
  --ink: #f7ecf8; --muted: #b5a2bd;
  --accent: #ff5c9a; --late: #ff8763; --ok: #5fd08f;
  --h1: #5b1a8c; --h2: #c2185b; --h3: #f4511e; --on-hero: #ffffff;
  --cs: 50%; --tint: 20%;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25); color-scheme: dark }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: transparent; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
i[data-lucide], .lucide { width: 1em; height: 1em; display: inline-block; flex: none; vertical-align: -0.125em; }

.app { max-width: 560px; margin: 0 auto; padding-block: 14px 170px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 26px; color: var(--on-hero); padding: 20px;
  background: radial-gradient(circle at 88% 12%, rgb(255 200 60 / .55), transparent 42%), linear-gradient(135deg, var(--h1) 0%, var(--h2) 55%, var(--h3) 100%);
  box-shadow: 0 14px 30px -12px var(--h2); display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; }
.hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .16;
  background-image: radial-gradient(circle, var(--on-hero) 1.2px, transparent 1.6px); background-size: 18px 18px; mask-image: linear-gradient(120deg, transparent 35%, #000); -webkit-mask-image: linear-gradient(120deg, transparent 35%, #000); }
.hero > * { position: relative; z-index: 1; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .85; margin: 0; }
.big { display: flex; align-items: baseline; gap: 10px; margin: 2px 0 0; }
.big b { font-family: var(--display); font-weight: 800; font-size: 84px; line-height: .86; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.big span { font-family: var(--display); font-weight: 600; font-size: 20px; line-height: 1.1; text-wrap: balance; }
.ring { position: relative; width: 84px; height: 84px; }
.ring svg { width: 84px; height: 84px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; stroke-linecap: round; }
.ring .tr { stroke: rgb(255 255 255 / .25); }
.ring .fg { stroke: #ffffff; transition: stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1); }
.ring div { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-weight: 700; font-size: 18px; line-height: 1; font-variant-numeric: tabular-nums; }
.ring small { display: block; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .85; margin-top: 3px; }
.pills { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.pills span { background: rgb(255 255 255 / .2); border-radius: 30px; padding: 6px 12px; font-size: 13px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; backdrop-filter: blur(4px); }

/* day strip */
.strip { display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px; }
.day { border-radius: 12px; padding: 7px 0 6px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink); transition: transform .12s, background .15s; }
.day:active { transform: scale(.9); }
.day small { font-size: 9px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); height: 11px; line-height: 11px; }
.day em { display: flex; gap: 2px; height: 5px; }
.day em u { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.day.past { opacity: .4; }
.day.today { background: var(--sunk); }
.day.fly small { color: var(--h3); } .day.wed small { color: var(--accent); }
.day.sel { background: linear-gradient(160deg, var(--h2), var(--h3)); color: var(--on-hero); opacity: 1; box-shadow: 0 6px 12px -6px var(--h2); }
.day.sel small { color: var(--on-hero); } .day.sel em u { background: var(--on-hero); }

/* sections and cards */
#view { display: flex; flex-direction: column; gap: 22px; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec h2 { margin: 0 0 2px; font-family: var(--display); font-weight: 800; font-size: 20px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.sec h2 small { font-family: var(--body); font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.sec h2.late { color: var(--late); }
.mini { height: 4px; border-radius: 2px; background: var(--sunk); overflow: hidden; margin-bottom: 4px; }
.mini span { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--h2), var(--h3)); }

.task { --c: #6b7a90; display: grid; grid-template-columns: 56px 1fr; align-items: stretch; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.check { display: grid; place-items: center; min-height: 60px; }
.check span { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--c); background: color-mix(in srgb, var(--c) var(--tint), var(--surface)); display: grid; place-items: center; transition: transform .15s; }
.check svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; }
.check:active span { transform: scale(.85); }
.task.done .check span, .task.pop .check span { background: var(--c); }
.task.done .check svg { stroke-dashoffset: 0; }
.task.pop .check span { animation: pop .42s cubic-bezier(.3,1.6,.5,1); box-shadow: 0 0 0 0 var(--c); }
.task.pop .check svg { transition: stroke-dashoffset .25s .1s; stroke-dashoffset: 0; }
@keyframes pop { 0% { transform: scale(.7); box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 60%, transparent); } 60% { transform: scale(1.2); } 100% { transform: scale(1); box-shadow: 0 0 0 14px transparent; } }
.main { text-align: left; padding: 13px 14px 13px 0; min-width: 0; display: flex; flex-direction: column; gap: 7px; justify-content: center; }
.main p { margin: 0; font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.task.done { box-shadow: none; background: transparent; outline: 1px dashed var(--line); outline-offset: -1px; }
.task.done .main p, .task.pop .main p { text-decoration: line-through; color: var(--muted); font-weight: 500; }
.note { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { --c: #6b7a90; display: inline-flex; align-items: center; gap: 5px; border-radius: 30px; padding: 3px 9px; font-size: 12px; font-weight: 700; white-space: nowrap;
  background: color-mix(in srgb, var(--c) var(--tint), var(--surface)); color: color-mix(in srgb, var(--c) var(--cs), var(--ink)); }
.tag.plain { background: var(--sunk); color: var(--muted); }
.tag.late { background: color-mix(in srgb, var(--late) 16%, var(--surface)); color: var(--late); }
.tag.now { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); color: var(--accent); }

/* filter chips, sheet chips */
.scroll { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.chip { --c: #6b7a90; flex: none; display: inline-flex; align-items: center; gap: 6px; border-radius: 30px; padding: 9px 14px; font-size: 14px; font-weight: 700; white-space: nowrap;
  background: color-mix(in srgb, var(--c) var(--tint), var(--surface)); color: color-mix(in srgb, var(--c) var(--cs), var(--ink)); transition: transform .12s; }
.chip:active { transform: scale(.94); }
.chip[aria-pressed="true"] { background: var(--c); color: #fff; box-shadow: 0 6px 12px -6px var(--c); }
.chip b { font-weight: 600; opacity: .75; }
.chip.neutral { background: var(--sunk); color: var(--ink); }
.chip.neutral[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.chip.dash { position: relative; background: transparent; outline: 1.5px dashed var(--line); outline-offset: -1.5px; color: var(--muted); }
.chip.dash input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
.wrapchips { display: flex; flex-wrap: wrap; gap: 8px; }

/* ideas */
.ideas { columns: 2; column-gap: 10px; }
.idea { --c: #d99a00; break-inside: avoid; margin: 0 0 10px; width: 100%; text-align: left; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
  background: color-mix(in srgb, var(--c) var(--tint), var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 25%, transparent); }
.idea p { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.idea .go { align-self: flex-start; display: inline-flex; gap: 5px; align-items: center; font-size: 13px; font-weight: 700; color: color-mix(in srgb, var(--c) var(--cs), var(--ink)); background: var(--surface); border-radius: 30px; padding: 6px 11px; }

.empty { border-radius: 22px; padding: 26px 20px; text-align: center; background: var(--sunk); color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.empty .lucide, .empty i { width: 30px; height: 30px; color: var(--accent); }
.empty strong { color: var(--ink); font-family: var(--display); font-size: 19px; }
.cta { margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; border-radius: 30px; padding: 10px 16px; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--h2), var(--h3)); }
.cta .lucide, .cta i { width: 1em; height: 1em; color: inherit; }
.link { color: var(--accent); font-weight: 700; font-size: 14px; padding: 8px 0; align-self: flex-start; display: inline-flex; gap: 6px; align-items: center; }
.banner { background: var(--sunk); border-radius: 14px; padding: 10px 14px; font-size: 14px; font-weight: 500; }
.banner.bad { color: var(--late); }

/* nav + add button */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nav div { max-width: 528px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1fr 72px; gap: 4px; align-items: center; }
.nav button[data-tab] { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 14px; font-size: 12px; font-weight: 700; color: var(--muted); position: relative; }
.nav button[data-tab] .lucide, .nav button[data-tab] i { width: 22px; height: 22px; }
.nav button[aria-selected="true"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.nav sup { position: absolute; top: 2px; left: calc(50% + 8px); min-width: 17px; height: 17px; border-radius: 9px; padding: 0 4px; background: var(--late); color: #fff; font-size: 10px; line-height: 17px; }
.fab { justify-self: end; width: 60px; height: 60px; border-radius: 50%; margin-top: -30px; color: #fff; background: linear-gradient(135deg, var(--h2), var(--h3)); box-shadow: 0 10px 20px -6px var(--h2); display: grid; place-items: center; transition: transform .15s; }
.fab .lucide, .fab i { width: 28px; height: 28px; }
.fab:active { transform: scale(.9) rotate(90deg); }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgb(20 5 25 / 0); transition: background .22s; display: flex; align-items: flex-end; justify-content: center; }
.scrim.open { background: rgb(20 5 25 / .55); }
.sheet { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 26px 26px 0 0; transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.9,.3,1);
  padding-top: 10px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; }
.scrim.open .sheet { transform: none; }
.grab { width: 42px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; flex: none; }
.shead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 30px; padding: 4px; }
.seg button { border-radius: 30px; padding: 8px 16px; font-weight: 700; font-size: 14px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.shead h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 20px; }
.x { width: 38px; height: 38px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; font-size: 18px; flex: none; }
.sheet textarea { width: 100%; border: 0; background: transparent; resize: none; font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1.25; padding: 0; outline: none; min-height: 56px; flex: none; }
.sheet textarea::placeholder { color: color-mix(in srgb, var(--muted) 60%, transparent); }
.sheet textarea.notes { font-family: var(--body); font-weight: 500; font-size: 15px; background: var(--sunk); border-radius: 14px; padding: 12px; min-height: 64px; }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.sfoot { display: flex; gap: 10px; align-items: center; }
.primary { flex: 1; border-radius: 16px; padding: 15px; font-weight: 700; font-size: 16px; color: #fff; background: linear-gradient(135deg, var(--h2), var(--h3)); box-shadow: 0 10px 18px -8px var(--h2); display: inline-flex; gap: 8px; align-items: center; justify-content: center; transition: transform .12s; }
.primary:active { transform: scale(.97); }
.ghost { border-radius: 16px; padding: 15px 14px; font-weight: 700; font-size: 14px; background: var(--sunk); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.ghost.danger { color: var(--late); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); z-index: 50; background: var(--ink); color: var(--bg); border-radius: 30px; padding: 11px 18px; display: flex; gap: 14px; align-items: center; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); white-space: nowrap; box-shadow: var(--shadow); }
.toast button { color: inherit; font-weight: 800; text-decoration: underline; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="app">
  <section class="hero">
    <div>
      <p class="eyebrow" id="eyebrow">Wed 25 Nov 2026</p>
      <p class="big"><b id="days">–</b><span id="headline">days to the wedding</span></p>
    </div>
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 84 84"><circle class="tr" cx="42" cy="42" r="36"></circle><circle class="fg" id="ringFg" cx="42" cy="42" r="36" stroke-dasharray="226.2" stroke-dashoffset="226.2"></circle></svg>
      <div><span id="ringNum">0%</span><small>done</small></div>
    </div>
    <div class="pills" id="pills"></div>
  </section>

  <div class="strip" id="strip" aria-label="Days from 11 to 25 November. Tap a day to see its tasks."></div>
  <div id="banner" class="banner" hidden></div>
  <main id="view"><div class="empty"><strong>Loading…</strong>Your tasks and ideas will show here.</div></main>
</div>

<nav class="nav"><div>
  <button data-tab="day" aria-selected="true"><i data-lucide="sun"></i>Day<sup id="nLate" hidden></sup></button>
  <button data-tab="list" aria-selected="false"><i data-lucide="list-checks"></i>Checklist</button>
  <button data-tab="ideas" aria-selected="false"><i data-lucide="lightbulb"></i>Ideas</button>
  <button class="fab" id="fab" aria-label="Add a task or idea"><i data-lucide="plus"></i></button>
</div></nav>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Add or edit"></div></div>
<div id="toast" class="toast" hidden></div>

    var id = "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    write(id, function () { return col.doc(id).set(data); });
  }
  function remove(it) {
    if (!canSave()) return;
    write(it.id, function () { return col.doc(it.id).delete(); });
    var copy = { text: it.text, kind: it.kind, done: it.done, due: it.due, cat: it.cat, note: it.note, created: it.created };
    toast("Deleted", "Undo", function () { write(it.id, function () { return col.doc(it.id).set(copy); }); });
  }
  function banner(msg, bad) { var b = $("banner"); b.hidden = !msg; b.textContent = msg || ""; b.className = "banner" + (bad ? " bad" : ""); }
  function toast(msg, action, fn) {
    var t = $("toast"); clearTimeout(toastTimer);
    t.textContent = ""; t.appendChild(document.createTextNode(msg));
    if (action) t.appendChild(h("button", { text: action, onclick: function () { t.hidden = true; fn(); } }));
    t.hidden = false;
    toastTimer = setTimeout(function () { t.hidden = true; }, action ? 6000 : 2200);
  }

  /* ---------- hero + strip ---------- */
  function renderTop() {
    var t = today(), toWed = diff(WEDDING, t), toFly = diff(FLIGHT, t);
    if (toWed > 0) { $("days").textContent = toWed; $("headline").textContent = (toWed === 1 ? "day" : "days") + " to the wedding"; }
    else if (toWed === 0) { $("days").textContent = "0"; $("headline").textContent = "Today is the wedding day"; }
    else { $("days").textContent = -toWed; $("headline").textContent = (toWed === -1 ? "day" : "days") + " married"; }

    var tasks = S.items.filter(function (i) { return i.kind === "task"; });
    var open = tasks.filter(function (i) { return !i.done; });
    var pct = tasks.length ? Math.round((tasks.length - open.length) / tasks.length * 100) : 0;
    $("ringFg").setAttribute("stroke-dashoffset", String(226.2 * (1 - pct / 100)));
    $("ringNum").textContent = pct + "%";

    var late = open.filter(function (i) { return i.due && i.due < t; }).length;
    var pills = $("pills"); pills.textContent = "";
    pills.appendChild(h("span", {}, [ic("plane-takeoff"), toFly > 1 ? "Fly in " + toFly + " days" : toFly === 1 ? "Fly tomorrow" : toFly === 0 ? "Flight day" : "In India"]));
    if (S.loaded) pills.appendChild(h("span", {}, [ic("circle-check"), open.length ? open.length + " to do" : "All done"]));
    if (late) pills.appendChild(h("span", {}, [ic("alarm-clock"), late + " overdue"]));
    $("nLate").hidden = !late; $("nLate").textContent = late;

    var count = {}; open.forEach(function (i) { if (i.due) count[i.due] = (count[i.due] || 0) + 1; });
    var strip = $("strip"); strip.textContent = "";
    for (var n = 0; n < 15; n++) (function (d) {
      var dots = h("em"); for (var k = 0; k < Math.min(count[d] || 0, 3); k++) dots.appendChild(h("u"));
      strip.appendChild(h("button", { class: "day" + (d < t ? " past" : "") + (d === t ? " today" : "") + (d === FLIGHT ? " fly" : "") + (d === WEDDING ? " wed" : "") + (S.tab === "day" && d === S.day ? " sel" : ""),
        "aria-label": nice(d) + ", " + plural(count[d] || 0, "open task"), "aria-pressed": S.tab === "day" && d === S.day ? "true" : "false",
        onclick: function () { S.day = d; S.tab = "day"; render(); } },
        [h("small", { text: d === FLIGHT ? "fly" : d === WEDDING ? "wed" : dow(d).slice(0, 2) }), String(+d.slice(8)), dots]));
    })(addDays(STRIP_START, n));
  }

  /* ---------- cards ---------- */
  function dueTag(it) {
    if (!it.due) return null;
    var d = diff(it.due, today());
    if (it.done) return h("span", { class: "tag plain" }, [ic("calendar"), nice(it.due)]);
    if (d < 0) return h("span", { class: "tag late" }, [ic("alarm-clock"), plural(-d, "day") + " late"]);
    if (d === 0) return h("span", { class: "tag now" }, [ic("calendar"), "Today"]);
    return h("span", { class: "tag plain" }, [ic("calendar"), d === 1 ? "Tomorrow" : nice(it.due)]);
  }
  function catTag(it) { var c = cat(it.cat); return h("span", { class: "tag", c: c[1] }, [ic(c[2]), c[0]]); }

  function taskCard(it, hideDue) {
    var c = cat(it.cat);
    var el = h("div", { class: "task" + (it.done ? " done" : ""), c: c[1] });
    el.appendChild(h("button", { class: "check", "aria-label": (it.done ? "Mark not done: " : "Mark done: ") + it.text, onclick: function () {
      if (it.done) { patch(it.id, { done: false }); return; }
      el.classList.add("pop");
      setTimeout(function () { patch(it.id, { done: true }); toast("Done", "Undo", function () { patch(it.id, { done: false }); }); }, calm ? 0 : 430);
    } }, [h("span", { html: CHECK })]));
    el.appendChild(h("button", { class: "main", "aria-label": "Edit: " + it.text, onclick: function () { openEdit(it); } }, [
      h("p", { text: it.text }),
      it.note ? h("div", { class: "note", text: it.note }) : null,
      h("div", { class: "meta" }, [catTag(it), hideDue ? null : dueTag(it)])
    ]));
    return el;
  }
  function sec(title, right, cls, kids, bar) {
    return h("section", { class: "sec" }, [h("h2", { class: cls || "" }, [h("span", { text: title }), right ? h("small", { text: right }) : null]),
      bar == null ? null : h("div", { class: "mini" }, [h("span", { style: "width:" + bar + "%" })])].concat(kids));
  }
  function empty(icon, title, text, cta, fn) {
    return h("div", { class: "empty" }, [ic(icon), h("strong", { text: title }), h("span", { text: text }), cta ? h("button", { class: "cta", onclick: fn }, [ic("plus"), cta]) : null]);
  }
  function byDue(a, b) { var x = a.due || "9", y = b.due || "9"; return x < y ? -1 : x > y ? 1 : a.created - b.created; }

  /* ---------- views ---------- */
  function render() {
    var t = today(); if (!S.day) S.day = t;
    renderTop();
    Array.prototype.forEach.call(document.querySelectorAll(".nav [data-tab]"), function (b) { b.setAttribute("aria-selected", b.dataset.tab === S.tab ? "true" : "false"); });
    var v = $("view"); v.textContent = "";
    if (!S.loaded) { v.appendChild(h("div", { class: "empty" }, [h("strong", { text: "Loading…" }), "Your tasks and ideas will show here."])); icons(); return; }

    var tasks = S.items.filter(function (i) { return i.kind === "task"; }).sort(byDue);
    var open = tasks.filter(function (i) { return !i.done; });
    var ideas = S.items.filter(function (i) { return i.kind !== "task"; }).sort(function (a, b) { return b.created - a.created; });

    if (S.tab === "day") {
      var isToday = S.day === t;
      var late = open.filter(function (i) { return i.due && i.due < t; });
      if (isToday && late.length) v.appendChild(sec("Overdue", plural(late.length, "task"), "late", late.map(function (i) { return taskCard(i); })));
      var mine = tasks.filter(function (i) { return i.due === S.day; }).sort(function (a, b) { return (a.done - b.done) || a.created - b.created; });
      var label = (isToday ? "Today" : S.day === addDays(t, 1) ? "Tomorrow" : nice(S.day)) + (S.day === FLIGHT ? " · flight day" : S.day === WEDDING ? " · wedding day" : "");
      var left = mine.filter(function (i) { return !i.done; }).length;
      if (mine.length) v.appendChild(sec(label, left ? left + " left" : "all done", "", mine.map(function (i) { return taskCard(i, true); })));
      else v.appendChild(sec(label, "", "", [empty("calendar-plus", "Nothing planned", "No tasks on " + nice(S.day) + " yet.", "Add for " + nice(S.day), function () { openAdd(); })]));
      if (isToday) {
        var soon = open.filter(function (i) { return i.due > t && i.due <= addDays(t, 3); });
        if (soon.length) v.appendChild(sec("Next 3 days", plural(soon.length, "task"), "", soon.map(function (i) { return taskCard(i); })));
        var undated = open.filter(function (i) { return !i.due; }).length;
        if (undated) v.appendChild(h("button", { class: "link", onclick: function () { S.tab = "list"; render(); } }, [plural(undated, "task") + " without a date", ic("arrow-right")]));
      } else v.appendChild(h("button", { class: "link", onclick: function () { S.day = t; render(); } }, [ic("arrow-left"), "Back to today"]));
    }

    if (S.tab === "list") {
      var counts = {}; open.forEach(function (i) { counts[cat(i.cat)[0]] = (counts[cat(i.cat)[0]] || 0) + 1; });
      var bar = h("div", { class: "scroll", role: "group", "aria-label": "Filter by tag" });
      bar.appendChild(h("button", { class: "chip neutral", "aria-pressed": S.filter === "All" ? "true" : "false", onclick: function () { S.filter = "All"; render(); } }, ["All ", h("b", { text: String(open.length) })]));
      CATS.forEach(function (c) {
        if (!counts[c[0]] && S.filter !== c[0]) return;
        bar.appendChild(h("button", { class: "chip", c: c[1], "aria-pressed": S.filter === c[0] ? "true" : "false", onclick: function () { S.filter = S.filter === c[0] ? "All" : c[0]; render(); } }, [ic(c[2]), c[0] + " ", h("b", { text: String(counts[c[0]] || 0) })]));
      });
      v.appendChild(bar);
      var pool = tasks.filter(function (i) { return S.filter === "All" || cat(i.cat)[0] === S.filter; });
      var phases = [
        ["Before the flight", function (i) { return i.due && i.due <= FLIGHT; }],
        ["In India", function (i) { return i.due > FLIGHT && i.due <= INDIA_END; }],
        ["Wedding week", function (i) { return i.due > INDIA_END && i.due <= WEDDING; }],
        ["After the wedding", function (i) { return i.due > WEDDING; }],
        ["No date yet", function (i) { return !i.due; }]
      ];
      var any = false;
      phases.forEach(function (p) {
        var all = pool.filter(p[1]); if (!all.length) return;
        var done = all.filter(function (i) { return i.done; }).length;
        var show = S.showDone ? all : all.filter(function (i) { return !i.done; });
        any = true;
        v.appendChild(sec(p[0], done + " of " + all.length + " done", "", show.map(function (i) { return taskCard(i); }), Math.round(done / all.length * 100)));
      });
      if (!any) v.appendChild(empty("list-checks", "No tasks here", S.filter === "All" ? "Tap the plus button to add your first task." : "Nothing tagged " + S.filter + " yet.", "Add a task", function () { openAdd(); }));
      var doneCount = pool.filter(function (i) { return i.done; }).length;
      if (doneCount) v.appendChild(h("button", { class: "link", onclick: function () { S.showDone = !S.showDone; render(); } }, [ic(S.showDone ? "eye-off" : "eye"), S.showDone ? "Hide done tasks" : "Show " + plural(doneCount, "done task")]));
    }

    if (S.tab === "ideas") {
      if (!ideas.length) v.appendChild(empty("lightbulb", "No ideas yet", "Dump anything here: a song, a gift, a question for the planner. Sort it out later.", "Add an idea", function () { openAdd(); }));
      else {
        var grid = h("div", { class: "ideas" });
        ideas.forEach(function (it) {
          var c = cat(it.cat);
          grid.appendChild(h("div", { class: "idea", c: it.cat && it.cat !== "Other" ? c[1] : "#d99a00", role: "button", tabindex: "0", onclick: function () { openEdit(it); },
            onkeydown: function (e) { if (e.key === "Enter" && e.target === e.currentTarget) openEdit(it); } }, [
            h("p", { text: it.text }), it.note ? h("div", { class: "note", text: it.note }) : null,
            h("button", { class: "go", onclick: function (e) { e.stopPropagation(); patch(it.id, { kind: "task", done: false }); toast("Moved to Checklist"); } }, [ic("list-plus"), "Make task"])
          ]));
        });
        v.appendChild(sec("Ideas", plural(ideas.length, "note"), "", [grid]));
      }
    }
    icons();
  }

  /* ---------- bottom sheet ---------- */
  function openAdd() {
    D = { mode: "add", kind: S.tab === "ideas" ? "idea" : "task", text: "", note: "", due: S.tab === "day" ? S.day : "", cat: S.tab === "list" && S.filter !== "All" ? S.filter : "Other" };
    showSheet();
  }
  function openEdit(it) { D = { mode: "edit", id: it.id, kind: it.kind, text: it.text, note: it.note, due: it.due, cat: cat(it.cat)[0], orig: it }; showSheet(); }

  function showSheet() {
    var sheet = $("sheet"), scrim = $("scrim"); sheet.textContent = "";
    var text = h("textarea", { id: "shText", rows: "2", placeholder: "What needs doing?", "aria-label": "Text", enterkeyhint: "done" }); text.value = D.text;
    function grow() { text.style.height = "auto"; text.style.height = Math.max(56, text.scrollHeight) + "px"; }
    text.addEventListener("input", function () { D.text = text.value; grow(); });
    text.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (D.mode === "add") submitAdd(); else closeSheet(true); } });

    var when = h("div"), tags = h("div", { class: "wrapchips", role: "group", "aria-label": "Tag" });
    var whenBox = h("div", {}, [h("p", { class: "lbl", text: "When" }), when]);
    var addLabel = document.createTextNode("Add task"), bT, bI;

    function drawWhen() {
      whenBox.hidden = D.kind !== "task"; when.textContent = "";
      var t = today(), row = h("div", { class: "scroll", role: "group", "aria-label": "Due date" }), listed = {};
      function pill(val, label, icon) {
        listed[val] = 1;
        row.appendChild(h("button", { class: "chip neutral", "aria-pressed": D.due === val ? "true" : "false", onclick: function () { D.due = val; drawWhen(); icons(); } }, [icon ? ic(icon) : null, label]));
      }
      pill("", "No date");
      var end = WEDDING > t ? WEDDING : addDays(t, 7);
      for (var d = t; d <= end; d = addDays(d, 1)) pill(d, d === t ? "Today" : d === addDays(t, 1) ? "Tomorrow" : dow(d) + " " + (+d.slice(8)), d === FLIGHT ? "plane-takeoff" : d === WEDDING ? "heart" : null);
      if (D.due && !listed[D.due]) pill(D.due, nice(D.due));
      var other = h("input", { type: "date", "aria-label": "Pick another date", tabindex: "-1" });
      other.addEventListener("change", function () { if (other.value) { D.due = other.value; drawWhen(); icons(); } });
      row.appendChild(h("label", { class: "chip dash", onclick: function () { try { other.showPicker(); } catch (e) {} } }, [ic("calendar-search"), "Other", other]));
      when.appendChild(row);
      var on = row.querySelector('[aria-pressed="true"]'); if (on && on.offsetLeft + on.offsetWidth > row.clientWidth) row.scrollLeft = on.offsetLeft - 60;
    }
    function drawTags() {
      tags.textContent = "";
      CATS.forEach(function (c) {
        tags.appendChild(h("button", { class: "chip", c: c[1], "aria-pressed": D.cat === c[0] ? "true" : "false", onclick: function () { D.cat = c[0]; drawTags(); icons(); } }, [ic(c[2]), c[0]]));
      });
    }
    function setKind(k) {
      D.kind = k; bT.setAttribute("aria-pressed", k === "task" ? "true" : "false"); bI.setAttribute("aria-pressed", k === "idea" ? "true" : "false");
      text.placeholder = k === "task" ? "What needs doing?" : "What's the idea?"; addLabel.textContent = k === "task" ? "Add task" : "Save idea"; drawWhen(); icons();
    }

    var head;
    if (D.mode === "add") {
      bT = h("button", { onclick: function () { setKind("task"); } }, [ic("circle-check"), "Task"]);
      bI = h("button", { onclick: function () { setKind("idea"); } }, [ic("lightbulb"), "Idea"]);
      head = h("div", { class: "seg", role: "group", "aria-label": "Save as" }, [bT, bI]);
    } else head = h("h3", { text: D.kind === "task" ? "Edit task" : "Edit idea" });

    sheet.appendChild(h("div", { class: "grab" }));
    sheet.appendChild(h("div", { class: "shead" }, [head, h("button", { class: "x", "aria-label": "Close", onclick: function () { closeSheet(D && D.mode === "edit"); } }, [ic("x")])]));
    sheet.appendChild(text);
    sheet.appendChild(whenBox);
    sheet.appendChild(h("div", {}, [h("p", { class: "lbl", text: "Tag" }), tags]));

    if (D.mode === "edit") {
      var note = h("textarea", { class: "notes", id: "shNote", rows: "2", placeholder: "Notes: phone numbers, sizes, prices, links…", "aria-label": "Notes" }); note.value = D.note;
      note.addEventListener("input", function () { D.note = note.value; });
      sheet.appendChild(note);
      var it = D.orig, isTask = D.kind === "task";
      sheet.appendChild(h("div", { class: "sfoot" }, [
        h("button", { class: "ghost danger", "aria-label": "Delete", onclick: function () { closeSheet(false); remove(it); } }, [ic("trash-2")]),
        h("button", { class: "ghost", onclick: function () { var k = isTask ? "idea" : "task"; D.kind = k; closeSheet(true); toast(k === "task" ? "Moved to Checklist" : "Moved to Ideas"); } }, [ic(isTask ? "lightbulb" : "list-plus"), isTask ? "To ideas" : "Make task"]),
        h("button", { class: "primary", onclick: function () { closeSheet(true); } }, [ic("check"), "Save"])
      ]));
      drawWhen();
    } else {
      sheet.appendChild(h("div", { class: "sfoot" }, [h("button", { class: "primary", onclick: submitAdd }, [ic("plus"), addLabel])]));
      setKind(D.kind);
    }
    drawTags();
    scrim.hidden = false; document.body.style.overflow = "hidden"; fitSheet(); icons();
    if (D.mode === "add") text.focus();
    requestAnimationFrame(function () { scrim.classList.add("open"); grow(); });
  }

  function submitAdd() {
    var text = $("shText"), t = (D.text || "").trim();
    if (!t) { text.focus(); return; }
    create({ text: t, kind: D.kind, done: false, due: D.kind === "task" ? D.due : "", cat: D.cat, note: "", created: Date.now() });
    D.text = ""; text.value = ""; text.style.height = "56px"; text.focus();
    toast(D.kind === "task" ? "Added" + (D.due ? " for " + nice(D.due) : " to Checklist") : "Saved to Ideas");
  }
  function closeSheet(save) {
    if (save && D && D.mode === "edit") {
      var o = D.orig, t = (D.text || "").trim() || o.text, n = (D.note || "").trim(), due = D.kind === "task" ? D.due : o.due;
      if (t !== o.text || n !== o.note || due !== o.due || D.cat !== cat(o.cat)[0] || D.kind !== o.kind) {
        var data = { text: t, note: n, due: due, cat: D.cat, kind: D.kind }; if (D.kind !== o.kind) data.done = false;
        patch(o.id, data);
      }
    }
    D = null; var scrim = $("scrim"); scrim.classList.remove("open"); document.body.style.overflow = "";
    setTimeout(function () { if (!D) scrim.hidden = true; }, calm ? 0 : 240);
  }
  function fitSheet() {
    var vv = window.visualViewport; if (!vv) return;
    $("scrim").style.bottom = Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + "px";
  }
  if (window.visualViewport) { visualViewport.addEventListener("resize", fitSheet); visualViewport.addEventListener("scroll", fitSheet); }
  $("scrim").addEventListener("click", function (e) { if (e.target === $("scrim")) closeSheet(D && D.mode === "edit"); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && D) closeSheet(false); });
  $("fab").addEventListener("click", openAdd);

  Array.prototype.forEach.call(document.querySelectorAll(".nav [data-tab]"), function (b) {
    b.addEventListener("click", function () { S.tab = b.dataset.tab; if (S.tab === "day") S.day = today(); try { localStorage.setItem("tab", S.tab); } catch (e) {} render(); window.scrollTo(0, 0); });
  });
  try { var saved = localStorage.getItem("tab"); if (saved === "day" || saved === "list" || saved === "ideas") S.tab = saved; } catch (e) {}

  /* ---------- start ---------- */
  render();
  setInterval(function () { renderTop(); icons(); }, 60000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && !D) render(); });

  function offline() { S.loaded = true; render(); banner("Saving is not available in this view. Open the page in Claude while signed in.", true); }
  var use = window.claude && window.claude.use;
  if (!use) { offline(); return; }
  window.claude.use("db").then(function (db) {
    if (!db) { offline(); return; }
    col = db.collection("items");
    var slow = setTimeout(function () { banner(S.loaded ? "Can't reach the saved list right now. What you see may be out of date." : "Can't reach your saved list yet. Still trying…"); }, 10000);
    col.onSnapshot(function (snap) {
      S.items = snap.docs.map(function (doc) {
        var x = doc.data() || {};
        return { id: doc.id, text: String(x.text || ""), kind: x.kind === "idea" ? "idea" : "task", done: !!x.done, due: typeof x.due === "string" ? x.due : "", cat: String(x.cat || "Other"), note: String(x.note || ""), created: +x.created || 0 };
      });
      S.loaded = true;
      if (!snap.metadata.fromCache) { clearTimeout(slow); if (!$("banner").classList.contains("bad")) banner(""); }
      render();
    }, function (err) {
      clearTimeout(slow); S.loaded = true; render();
      banner(err && err.code === "revoked" ? "This list is no longer available in this view." : "The list stopped updating. Close and reopen the page.", true);
    });
  });
})();
