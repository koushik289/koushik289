name: Outage
options:
  bundleIdPrefix: com.example
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    TARGETED_DEVICE_FAMILY: 1
packages: {}
targets:
  Outage:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Outage/Sources
      - path: Outage/Resources
        type: resources
    info:
      path: Outage/Info.plist
    entitlements:
      path: Outage/Outage.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Outage
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - OutageTests
  OutageTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OutageTests
    dependencies:
      - target: Outage
